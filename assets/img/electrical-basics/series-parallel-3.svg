<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <text x="30" y="34" font-size="15" fill="#888888" font-weight="bold">3 in Series</text>

  <g stroke="#888888" stroke-width="2.5">
    <line x1="30" y1="80" x2="90" y2="80"/>
    <line x1="170" y1="80" x2="240" y2="80"/>
    <line x1="320" y1="80" x2="390" y2="80"/>
    <line x1="470" y1="80" x2="530" y2="80"/>
  </g>
  <g fill="none" stroke="#3B82C4" stroke-width="2.5">
    <rect x="90" y="68" width="80" height="24" rx="3"/>
    <rect x="240" y="68" width="80" height="24" rx="3"/>
    <rect x="390" y="68" width="80" height="24" rx="3"/>
  </g>
  <g font-size="14" fill="#3B82C4" font-weight="bold" text-anchor="middle">
    <text x="130" y="60">R1</text>
    <text x="280" y="60">R2</text>
    <text x="430" y="60">R3</text>
  </g>
  <circle cx="205" cy="80" r="5" fill="#E8902A"/>
  <circle cx="355" cy="80" r="5" fill="#E8902A"/>
  <text x="280" y="128" text-anchor="middle" font-size="14" fill="#888888">R = R1 + R2 + R3</text>

  <line x1="30" y1="160" x2="530" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="30" y="194" font-size="15" fill="#888888" font-weight="bold">3 in Parallel</text>

  <g stroke="#888888" stroke-width="2.5" fill="none">
    <line x1="30" y1="290" x2="150" y2="290"/>
    <line x1="410" y1="290" x2="530" y2="290"/>
    <line x1="150" y1="225" x2="150" y2="355"/>
    <line x1="410" y1="225" x2="410" y2="355"/>
    <line x1="150" y1="225" x2="240" y2="225"/>
    <line x1="320" y1="225" x2="410" y2="225"/>
    <line x1="150" y1="290" x2="240" y2="290"/>
    <line x1="320" y1="290" x2="410" y2="290"/>
    <line x1="150" y1="355" x2="240" y2="355"/>
    <line x1="320" y1="355" x2="410" y2="355"/>
  </g>
  <g fill="none" stroke="#3B82C4" stroke-width="2.5">
    <rect x="240" y="213" width="80" height="24" rx="3"/>
    <rect x="240" y="278" width="80" height="24" rx="3"/>
    <rect x="240" y="343" width="80" height="24" rx="3"/>
  </g>
  <g font-size="14" fill="#3B82C4" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="280" y="225">R1</text>
    <text x="280" y="290">R2</text>
    <text x="280" y="355">R3</text>
  </g>
  <circle cx="150" cy="290" r="5" fill="#E8902A"/>
  <circle cx="410" cy="290" r="5" fill="#E8902A"/>
  <text x="138" y="316" text-anchor="end" font-size="14" fill="#E8902A" font-weight="bold">A</text>
  <text x="422" y="316" font-size="14" fill="#E8902A" font-weight="bold">B</text>
  <text x="280" y="392" text-anchor="middle" font-size="14" fill="#888888">1/R = 1/R1 + 1/R2 + 1/R3</text>
</svg>
