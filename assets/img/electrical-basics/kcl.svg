<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82C4"/>
    </marker>
  </defs>

  <line x1="30" y1="100" x2="190" y2="100" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="105" y="86" text-anchor="middle" font-size="16" fill="#3B82C4" font-weight="bold">5mA</text>
  <text x="105" y="122" text-anchor="middle" font-size="12" fill="#888888">In</text>

