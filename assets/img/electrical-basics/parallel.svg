<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82C4"/>
    </marker>
  </defs>

  <line x1="30" y1="135" x2="130" y2="135" stroke="#888888" stroke-width="2.5"/>
  <line x1="390" y1="135" x2="490" y2="135" stroke="#888888" stroke-width="2.5"/>

  <polyline points="130,70 130,200" fill="none" stroke="#888888" stroke-width="2.5"/>
  <polyline points="390,70 390,200" fill="none" stroke="#888888" stroke-width="2.5"/>

  <line x1="130" y1="70" x2="215" y2="70" stroke="#888888" stroke-width="2.5"/>
  <line x1="305" y1="70" x2="390" y2="70" stroke="#888888" stroke-width="2.5"/>
  <rect x="215" y="58" width="90" height="24" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="260" y="48" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">R1 1kΩ</text>
  <text x="260" y="102" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">3V, 3mA</text>

  <line x1="130" y1="200" x2="215" y2="200" stroke="#888888" stroke-width="2.5"/>
  <line x1="305" y1="200" x2="390" y2="200" stroke="#888888" stroke-width="2.5"/>
  <rect x="215" y="188" width="90" height="24" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="260" y="178" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">R2 2kΩ</text>
  <text x="260" y="232" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">3V, 1.5mA</text>

  <line x1="45" y1="115" x2="110" y2="115" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="78" y="104" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">4.5mA</text>
  <line x1="410" y1="115" x2="475" y2="115" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="443" y="104" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">4.5mA</text>

  <circle cx="130" cy="135" r="5" fill="#E8902A"/>
  <text x="112" y="160" text-anchor="end" font-size="14" fill="#E8902A" font-weight="bold">A 3V</text>
  <circle cx="390" cy="135" r="5" fill="#E8902A"/>
  <text x="408" y="160" font-size="14" fill="#E8902A" font-weight="bold">B 0V</text>

  <text x="260" y="265" text-anchor="middle" font-size="14" fill="#888888">Same voltage, current splits (3mA + 1.5mA = 4.5mA)</text>
  <text x="260" y="287" text-anchor="middle" font-size="14" fill="#888888">Equivalent R = 3V / 4.5mA ≈ 0.67kΩ (smaller than R1)</text>
</svg>
