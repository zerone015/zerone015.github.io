<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" width="460" height="230" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82C4"/>
    </marker>
  </defs>

  <line x1="40" y1="110" x2="180" y2="110" stroke="#888888" stroke-width="2.5"/>
  <line x1="280" y1="110" x2="420" y2="110" stroke="#888888" stroke-width="2.5"/>

  <rect x="180" y="98" width="100" height="24" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="230" y="88" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">R = 1kΩ</text>

  <line x1="70" y1="70" x2="150" y2="70" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="110" y="58" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">I = 2mA</text>

  <circle cx="110" cy="110" r="5" fill="#E8902A"/>
  <text x="110" y="142" text-anchor="middle" font-size="15" fill="#E8902A" font-weight="bold">3.3V</text>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#888888">In</text>

  <circle cx="350" cy="110" r="5" fill="#E8902A"/>
  <text x="350" y="142" text-anchor="middle" font-size="15" fill="#E8902A" font-weight="bold">1.3V</text>
  <text x="350" y="160" text-anchor="middle" font-size="12" fill="#888888">Out</text>

  <polyline points="180,138 180,148 280,148 280,138" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="230" y="168" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">−2V</text>

  <text x="230" y="210" text-anchor="middle" font-size="15" fill="#888888">Drop = I × R = 2mA × 1kΩ = 2V</text>
</svg>
