<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 356" width="540" height="356" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82C4"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="250" height="220" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="165" y="30" text-anchor="middle" font-size="14" fill="#888888" font-weight="bold">Inside Power Source</text>

  <g stroke="#888888" stroke-width="2.5" fill="none">
    <line x1="100" y1="130" x2="100" y2="80"/>
    <line x1="100" y1="80" x2="160" y2="80"/>
    <line x1="220" y1="80" x2="440" y2="80"/>
    <line x1="440" y1="80" x2="440" y2="130"/>
    <line x1="440" y1="210" x2="440" y2="240"/>
    <line x1="440" y1="240" x2="100" y2="240"/>
    <line x1="100" y1="240" x2="100" y2="146"/>
  </g>

  <line x1="84" y1="130" x2="116" y2="130" stroke="#E8902A" stroke-width="3"/>
  <line x1="92" y1="146" x2="108" y2="146" stroke="#E8902A" stroke-width="5"/>
  <text x="76" y="143" text-anchor="end" font-size="14" fill="#E8902A" font-weight="bold">E</text>
  <text x="122" y="143" font-size="13" fill="#E8902A">1.5V</text>

  <rect x="160" y="70" width="60" height="20" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="190" y="62" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">r 0.5Ω</text>
  <text x="190" y="110" text-anchor="middle" font-size="13" fill="#3B82C4">−0.5V</text>

  <rect x="430" y="130" width="20" height="80" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="462" y="166" font-size="14" fill="#3B82C4" font-weight="bold">Load</text>
  <text x="462" y="184" font-size="13" fill="#3B82C4">1Ω, −1.0V</text>

  <circle cx="290" cy="80" r="5" fill="#E8902A"/>
  <text x="300" y="64" text-anchor="start" font-size="13" fill="#E8902A" font-weight="bold">+ Terminal 1.0V</text>
  <circle cx="290" cy="240" r="5" fill="#E8902A"/>
  <text x="290" y="282" text-anchor="middle" font-size="13" fill="#E8902A" font-weight="bold">− Terminal 0V (GND)</text>

  <line x1="330" y1="100" x2="390" y2="100" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="360" y="122" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">I = 1A</text>

  <text x="270" y="316" text-anchor="middle" font-size="14" fill="#888888">Terminal Voltage = E − I × r = 1.5 − 1 × 0.5 = 1.0V</text>
  <text x="270" y="340" text-anchor="middle" font-size="13" fill="#888888">I = E / (r + Load) = 1.5 / 1.5 = 1A</text>
</svg>
