<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82C4"/>
    </marker>
  </defs>

  <line x1="40" y1="110" x2="130" y2="110" stroke="#888888" stroke-width="2.5"/>
  <line x1="220" y1="110" x2="300" y2="110" stroke="#888888" stroke-width="2.5"/>
  <line x1="390" y1="110" x2="480" y2="110" stroke="#888888" stroke-width="2.5"/>

  <rect x="130" y="98" width="90" height="24" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="175" y="88" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">R1 1kΩ</text>
  <rect x="300" y="98" width="90" height="24" rx="3" fill="none" stroke="#3B82C4" stroke-width="2.5"/>
  <text x="345" y="88" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">R2 2kΩ</text>

  <line x1="140" y1="50" x2="210" y2="50" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="175" y="38" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">1.1mA</text>
  <line x1="310" y1="50" x2="380" y2="50" stroke="#3B82C4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="345" y="38" text-anchor="middle" font-size="13" fill="#3B82C4" font-weight="bold">1.1mA</text>

  <circle cx="70" cy="110" r="5" fill="#E8902A"/>
  <text x="70" y="140" text-anchor="middle" font-size="14" fill="#E8902A" font-weight="bold">3.3V</text>
  <circle cx="260" cy="110" r="5" fill="#E8902A"/>
  <text x="260" y="140" text-anchor="middle" font-size="14" fill="#E8902A" font-weight="bold">2.2V</text>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#888888">Shared Node</text>
  <circle cx="450" cy="110" r="5" fill="#E8902A"/>
  <text x="450" y="140" text-anchor="middle" font-size="14" fill="#E8902A" font-weight="bold">0V</text>

  <polyline points="130,168 130,176 220,176 220,168" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="175" y="194" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">V1 = 1.1V</text>
  <polyline points="300,168 300,176 390,176 390,168" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="345" y="194" text-anchor="middle" font-size="14" fill="#3B82C4" font-weight="bold">V2 = 2.2V</text>

  <polyline points="70,206 70,214 450,214 450,206" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="260" y="234" text-anchor="middle" font-size="14" fill="#E8902A" font-weight="bold">Total 3.3V</text>

  <text x="260" y="260" text-anchor="middle" font-size="14" fill="#888888">Same current, voltage splits (1.1V + 2.2V = 3.3V)</text>
</svg>
